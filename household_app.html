<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家計簿アプリ | Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #222;
    }

    header {
      text-align: center;
      padding: 30px 10px;
      background-color: #222222;
      color: white;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background-color: #f9f9f9;
      padding: 25px;
      margin-bottom: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }

    h2 {
      margin-top: 0;
    }

    .screenshots {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }

    .screenshots img {
      width: 260px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .github-link {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 16px;
      background-color: #222;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .github-link:hover {
      background-color: #555;
    }

    .back {
      text-align: center;
      margin-top: 40px;
    }

    .back a {
      text-decoration: none;
      font-weight: bold;
      color: #222;
    }
  </style>
</head>

<body>

<header>
  <h1>家計簿アプリ（課題08）</h1>
  <p>Python / Streamlit</p>
</header>

<main>

  <section class="card">
    <h2>概要</h2>
    <p>
      Python学習の集大成として制作した家計簿アプリです。<br>
      日々の支出を「日付・カテゴリ・内容・金額」で記録し、
      一覧表示やカテゴリ別のグラフ分析を行うことができます。
    </p>
    <p>
      クラス設計・ファイル分割を意識し、保守性の高い構成を目指しました。
    </p>

    <a class="github-link" href="https://github.com/ToTi-Hub/household_account_app.git" target="_blank">
      GitHubでソースコードを見る
    </a>
  </section>

  <section class="card">
    <h2>使用技術</h2>
    <ul>
      <li>Python</li>
      <li>Streamlit</li>
      <li>Pandas</li>
      <li>Git / GitHub</li>
    </ul>
  </section>

  <section class="card">
    <h2>スクリーンショット</h2>
    <div class="screenshots">
      <img src="images/house_1.png" alt="スクリーンショット1">
      <img src="images/house_2.png" alt="スクリーンショット2">
      <img src="images/house_3.png" alt="スクリーンショット3">
    </div>
  </section>

  <div class="back">
    <a href="index.html">← トップページに戻る</a>
  </div>

</main>

</body>
</html>
